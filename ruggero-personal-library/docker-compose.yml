version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: ruggero-personal-library_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/ruggerocapo/personal-library:0.2.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 20s
    mem_limit: 256m
    environment:
      DATA_DIR: /data
      TZ: Europe/Rome
      # Hermes Agent from the Umbrel App Store; its API server must be enabled (see README)
      HERMES_URL: http://hermes-agent_web_1:8642
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data:/data
